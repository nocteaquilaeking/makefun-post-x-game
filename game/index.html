<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Star Catcher — a ghost, a night sky, one prompt</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0b0620; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
  #wrap { position: relative; width: min(100vw, 56.25vh); aspect-ratio: 9 / 16; }
  canvas { display: block; width: 100%; height: 100%; border-radius: 12px;
           box-shadow: 0 0 60px rgba(150, 90, 255, 0.35); touch-action: none; }
  #hint { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center;
          color: rgba(255,255,255,0.55); font-size: 12px; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="540" height="960"></canvas>
  <div id="hint">move with &larr; &rarr; keys, mouse or touch &mdash; catch stars, dodge meteors</div>
</div>
<script>
'use strict';
// Star Catcher: a little ghost drifts along the bottom of a night sky,
// catching falling stars and dodging meteors. One prompt, one game.
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const FLOOR = H - 110;
const GAME_SECONDS = 60;

const demo = new URLSearchParams(location.search).get('demo') === '1';

const state = {
  mode: 'title',        // title | playing | over
  score: 0, caught: 0, missed: 0, lives: 3,
  timeLeft: GAME_SECONDS, elapsed: 0,
  ghostX: W / 2, ghostTX: W / 2, ghostBob: 0,
  items: [], sparks: [], keys: {},
  spawnT: 0, meteorT: 0, flash: 0,
};

function rnd(a, b) { return a + Math.random() * (b - a); }

function spawn(kind) {
  const x = rnd(30, W - 30);
  if (kind === 'star') {
    state.items.push({ kind, x, y: -20, vy: rnd(150, 230), r: 15,
                       spin: rnd(-1.6, 1.6), a: rnd(0, Math.PI * 2), hue: rnd(42, 54) });
  } else {
    state.items.push({ kind, x, y: -30, vy: rnd(280, 380), r: 19,
                       spin: rnd(-3, 3), a: rnd(0, Math.PI * 2), trail: [] });
  }
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), s = rnd(40, 220);
    state.sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                        life: rnd(0.3, 0.7), color });
  }
}

function startGame() {
  state.mode = 'playing';
  state.score = 0; state.caught = 0; state.missed = 0; state.lives = 3;
  state.timeLeft = GAME_SECONDS; state.elapsed = 0;
  state.items = []; state.sparks = [];
  state.ghostX = W / 2; state.ghostTX = W / 2;
}

function drawStar(x, y, r, rot, color) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 === 0 ? r : r * 0.45;
    const a = (i * Math.PI) / 5 - Math.PI / 2;
    ctx[i === 0 ? 'moveTo' : 'lineTo'](Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawGhost(x, y, bob) {
  const w = 74, h = 86;
  ctx.save();
  ctx.translate(x, y + Math.sin(bob) * 4);
  // soft glow under the ghost
  const glow = ctx.createRadialGradient(0, 10, 4, 0, 10, 70);
  glow.addColorStop(0, 'rgba(190,160,255,0.35)');
  glow.addColorStop(1, 'rgba(190,160,255,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(-70, -60, 140, 140);
  // sheet body: dome, straight sides, wavy hem
  ctx.fillStyle = '#f4f0ff';
  ctx.beginPath();
  ctx.moveTo(-w / 2, h / 2);
  ctx.lineTo(-w / 2, -h / 4);
  ctx.arc(0, -h / 4, w / 2, Math.PI, 0);
  ctx.lineTo(w / 2, h / 2);
  const waves = 4, step = w / waves;
  for (let i = 0; i < waves; i++) {
    const x0 = w / 2 - i * step;
    ctx.quadraticCurveTo(x0 - step / 2, h / 2 + (i % 2 === 0 ? 14 : -4), x0 - step, h / 2);
  }
  ctx.closePath(); ctx.fill();
  // face: two eyes and a small open mouth
  ctx.fillStyle = '#241a3d';
  ctx.beginPath(); ctx.ellipse(-13, -14, 7, 10, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(13, -14, 7, 10, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, 8, 6, 8, 0, 0, Math.PI * 2); ctx.fill();
  // blush
  ctx.fillStyle = 'rgba(255,150,200,0.55)';
  ctx.beginPath(); ctx.ellipse(-24, 2, 7, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(24, 2, 7, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawMeteor(it) {
  ctx.save();
  ctx.translate(it.x, it.y); ctx.rotate(it.a);
  const g = ctx.createRadialGradient(0, 0, 2, 0, 0, it.r + 14);
  g.addColorStop(0, 'rgba(255,220,150,0.95)');
  g.addColorStop(0.45, 'rgba(255,120,60,0.85)');
  g.addColorStop(1, 'rgba(255,80,40,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, it.r + 14, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#3a2a22';
  ctx.beginPath(); ctx.arc(0, 0, it.r * 0.62, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath(); ctx.arc(-4, -5, it.r * 0.25, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawBackground(t) {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#120a33');
  sky.addColorStop(0.55, '#241252');
  sky.addColorStop(1, '#3d1a5e');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);
  // fixed stars in the sky, twinkling
  for (let i = 0; i < 70; i++) {
    const sx = (i * 97.3) % W, sy = (i * 61.7) % (H * 0.7);
    const tw = 0.35 + 0.65 * Math.abs(Math.sin(t * 0.9 + i));
    ctx.fillStyle = `rgba(255,255,255,${(tw * 0.8).toFixed(2)})`;
    const s = (i % 3) + 1;
    ctx.fillRect(sx, sy, s, s);
  }
  // moon
  ctx.fillStyle = '#ffeecf';
  ctx.beginPath(); ctx.arc(W - 78, 92, 42, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(220,190,140,0.5)';
  ctx.beginPath(); ctx.arc(W - 92, 82, 8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(W - 66, 104, 6, 0, Math.PI * 2); ctx.fill();
  // distant hills
  ctx.fillStyle = '#160b2e';
  ctx.beginPath(); ctx.moveTo(0, H - 60);
  for (let x = 0; x <= W; x += 30) ctx.lineTo(x, H - 60 - Math.sin(x * 0.012 + 1.2) * 26);
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
}

function drawHUD() {
  ctx.fillStyle = 'rgba(10,5,30,0.55)';
  ctx.fillRect(0, 0, W, 64);
  ctx.fillStyle = '#ffe9a8';
  ctx.font = 'bold 30px system-ui, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('★ ' + state.score, 18, 33);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 26px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(Math.ceil(state.timeLeft) + 's', W / 2, 33);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ff9db1';
  ctx.fillText('♥'.repeat(state.lives) + '♡'.repeat(3 - state.lives), W - 18, 33);
}

function drawCenter(lines, y0) {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((ln, i) => {
    ctx.font = ln.font;
    ctx.fillStyle = ln.color;
    ctx.fillText(ln.text, W / 2, y0 + i * ln.gap);
  });
}

function update(dt) {
  state.elapsed += dt;
  state.ghostBob += dt * 3;
  if (state.flash > 0) state.flash -= dt;

  if (state.mode === 'playing') {
    state.timeLeft -= dt;
    if (state.timeLeft <= 0) { state.timeLeft = 0; state.mode = 'over'; }

    // demo autopilot: drift toward the lowest falling star
    if (demo) {
      let best = null;
      for (const it of state.items) {
        if (it.kind === 'star' && (!best || it.y > best.y)) best = it;
      }
      if (best) state.ghostTX = best.x;
      else state.ghostTX = W / 2 + Math.sin(state.elapsed * 0.8) * 120;
      // demo never dies: top the lives back up
      state.lives = 3;
      if (state.mode === 'over') startGame();
    }

    const speed = state.keys.ArrowLeft || state.keys.a ? -420
      : state.keys.ArrowRight || state.keys.d ? 420 : 0;
    if (speed) state.ghostTX = Math.max(45, Math.min(W - 45, state.ghostTX + speed * dt));
    state.ghostX += (state.ghostTX - state.ghostX) * Math.min(1, dt * 14);

    state.spawnT -= dt;
    if (state.spawnT <= 0) { spawn('star'); state.spawnT = rnd(0.45, 0.9); }
    state.meteorT -= dt;
    if (state.meteorT <= 0) { spawn('meteor'); state.meteorT = rnd(1.4, 2.4); }

    for (let i = state.items.length - 1; i >= 0; i--) {
      const it = state.items[i];
      it.y += it.vy * dt;
      it.a += it.spin * dt;
      if (it.kind === 'meteor') {
        it.trail.push({ x: it.x, y: it.y });
        if (it.trail.length > 7) it.trail.shift();
      }
      const dx = it.x - state.ghostX, dy = it.y - (FLOOR - 30);
      const hit = Math.abs(dx) < 52 && Math.abs(dy) < 62;
      if (hit) {
        if (it.kind === 'star') {
          state.score += 10; state.caught++;
          burst(it.x, it.y, '#ffe27a', 14);
        } else {
          state.lives--; state.flash = 0.35;
          burst(it.x, it.y, '#ff7a5c', 20);
          if (state.lives <= 0) state.mode = 'over';
        }
        state.items.splice(i, 1);
        continue;
      }
      if (it.y > H + 40) {
        if (it.kind === 'star') state.missed++;
        state.items.splice(i, 1);
      }
    }
  }

  for (let i = state.sparks.length - 1; i >= 0; i--) {
    const s = state.sparks[i];
    s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 260 * dt; s.life -= dt;
    if (s.life <= 0) state.sparks.splice(i, 1);
  }
}

function render(t) {
  drawBackground(t);
  for (const it of state.items) {
    if (it.kind === 'meteor') {
      ctx.strokeStyle = 'rgba(255,140,70,0.5)';
      ctx.lineWidth = 5; ctx.beginPath();
      it.trail.forEach((p, i) => (i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y)));
      ctx.stroke();
      drawMeteor(it);
    } else {
      drawStar(it.x, it.y, it.r, it.a, `hsl(${it.hue} 100% 68%)`);
    }
  }
  for (const s of state.sparks) {
    ctx.globalAlpha = Math.max(0, s.life / 0.7);
    ctx.fillStyle = s.color;
    ctx.fillRect(s.x - 2, s.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
  drawGhost(state.ghostX, FLOOR, state.ghostBob);
  drawHUD();

  if (state.mode === 'title') {
    ctx.fillStyle = 'rgba(8,4,26,0.62)';
    ctx.fillRect(0, 0, W, H);
    drawCenter([
      { text: 'STAR CATCHER', font: 'bold 52px system-ui, sans-serif', color: '#ffe9a8', gap: 76 },
      { text: 'a little ghost, a night sky,', font: '26px system-ui, sans-serif', color: '#fff', gap: 40 },
      { text: 'one prompt', font: '26px system-ui, sans-serif', color: '#fff', gap: 66 },
      { text: 'catch ★  dodge ☄', font: 'bold 30px system-ui, sans-serif', color: '#ffb3c6', gap: 52 },
      { text: '60 seconds · 3 lives', font: '24px system-ui, sans-serif', color: '#cfc4ff', gap: 80 },
      { text: demo ? 'demo mode — watch it play' : 'press SPACE or tap to start',
        font: 'bold 26px system-ui, sans-serif', color: '#9df2c0', gap: 40 },
    ], 330);
  }
  if (state.mode === 'over') {
    ctx.fillStyle = 'rgba(8,4,26,0.68)';
    ctx.fillRect(0, 0, W, H);
    drawCenter([
      { text: 'TIME UP!', font: 'bold 56px system-ui, sans-serif', color: '#ffe9a8', gap: 80 },
      { text: 'score  ' + state.score, font: 'bold 40px system-ui, sans-serif', color: '#fff', gap: 56 },
      { text: state.caught + ' stars caught · ' + state.missed + ' missed',
        font: '26px system-ui, sans-serif', color: '#cfc4ff', gap: 60 },
      { text: 'press R to play again', font: 'bold 26px system-ui, sans-serif', color: '#9df2c0', gap: 40 },
    ], 380);
  }
  if (state.flash > 0) {
    ctx.fillStyle = `rgba(255,60,60,${(state.flash * 0.9).toFixed(2)})`;
    ctx.fillRect(0, 0, W, H);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render(now / 1000);
  requestAnimationFrame(frame);
}

addEventListener('keydown', (e) => {
  state.keys[e.key] = true;
  if (e.key === ' ' && state.mode === 'title') { e.preventDefault(); startGame(); }
  if ((e.key === 'r' || e.key === 'R') && state.mode === 'over') startGame();
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') e.preventDefault();
});
addEventListener('keyup', (e) => { state.keys[e.key] = false; });

function pointTo(x) {
  state.ghostTX = Math.max(45, Math.min(W - 45, x));
}
cv.addEventListener('pointerdown', (e) => {
  const r = cv.getBoundingClientRect();
  pointTo((e.clientX - r.left) * (W / r.width));
  if (state.mode === 'title') startGame();
  else if (state.mode === 'over') startGame();
});
cv.addEventListener('pointermove', (e) => {
  if (e.buttons) {
    const r = cv.getBoundingClientRect();
    pointTo((e.clientX - r.left) * (W / r.width));
  }
});

if (demo) startGame();
requestAnimationFrame(frame);
</script>
</body>
</html>
